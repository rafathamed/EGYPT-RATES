name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      updater_signing_ready: ${{ steps.signing.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Generate application icons
        run: npm run icons
      - name: Check updater signing key
        id: signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            "ready=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY is not configured. Only the frontend check will run; no update can be published."
          } else {
            "ready=true" >> $env:GITHUB_OUTPUT
            Write-Host "Updater signing key is available."
          }
      - name: Build signed Windows application
        if: steps.signing.outputs.ready == 'true'
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Validate frontend while signing key is not configured
        if: steps.signing.outputs.ready != 'true'
        run: npm run build
      - name: Upload signed Windows installers
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EGYPT-RATES-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && needs.build.outputs.updater_signing_ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Read application version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already released
        id: release-check
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download signed Windows installers
        uses: actions/download-artifact@v4
        with:
          name: EGYPT-RATES-Windows
          path: release-assets
      - name: Generate signed updater manifest
        if: github.ref_type == 'tag' || steps.release-check.outputs.publish == 'true'
        run: node scripts/generate-update-manifest.mjs release-assets
      - name: Publish GitHub Release with in-app updater metadata
        if: github.ref_type == 'tag' || steps.release-check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*
